[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-desktops-mcp"
version = "0.1.0"
description = "MCP server: parallel vision-based computer use on Windows virtual desktops (research prototype)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4",
    "pyvda>=0.6.0",
    "psutil>=5.9",
    "pillow>=10.0",
]

[project.scripts]
vision-desktops = "vision_desktops.server:main"

[tool.setuptools.packages.find]
where = ["src"]
